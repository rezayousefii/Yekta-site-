{% extends "base.html" %}
{% load static %}

{% block title %}رمز عوض شد — YEKTA{% endblock %}

{% block css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}

{% block content %}
<div class="auth">

  <aside class="auth__side">
    <span class="auth__mark">YEKTA</span>

    <div class="auth__pitch">
      <span class="auth__bloom" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <g class="spin">
            <ellipse cx="60" cy="30" rx="8" ry="24"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(45 60 60)"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(90 60 60)"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(135 60 60)"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(180 60 60)"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(225 60 60)"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(270 60 60)"/>
            <ellipse cx="60" cy="30" rx="8" ry="24" transform="rotate(315 60 60)"/>
          </g>
          <circle class="sun-core" cx="60" cy="60" r="19"/>
          <circle class="sun-seed" cx="60" cy="60" r="10"/>
        </svg>
      </span>

      <h2>تمام شد.</h2>
      <p>رمزت عوض شد؛ حالا می‌تونی وارد شوی.</p>
    </div>

    <span></span>
  </aside>

  <main class="auth__main">
    <div class="auth__head">
      <h1 class="auth__title">رمز عوض شد</h1>
      <p class="auth__sub">حالا با رمز تازه وارد شو.</p>
    </div>

    <div class="wiz__nav">
      <a href="{% url 'login' %}" class="btn" style="display:inline-block; text-decoration:none;">ورود</a>
    </div>
  </main>

</div>
{% endblock %}
